name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04 }
          - { name: windows-x64, os: windows-2022 }
          - { name: macos-x64, os: macos-15-intel }
          - { name: macos-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fakeroot dpkg libfuse2 xvfb
      - name: Install macOS media tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install Windows media tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: npm ci
      - run: npm test
      - run: npm run desktop:check
      - name: Build installers
        run: npm run desktop:make
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Check installed worker on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run desktop:test:packaged
        env:
          UTUBE_TEST_NO_SANDBOX: '1'
      - name: Test desktop on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run desktop:test
        env:
          UTUBE_TEST_NO_SANDBOX: '1'
      - name: Collect versioned installers and checksums
        run: node scripts/collect-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish tested artifacts together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag --title "uTube ${RELEASE_TAG#v}" --notes-file "docs/releases/${RELEASE_TAG#v}.md"
